<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bingo Card Maker</title>
  <link rel="stylesheet" href="style.css?v=20261105s">
</head>
<body>
  <main>
    <nav class="tools"><a href="index.html" aria-current="page">Bingo Card Maker</a><a href="namecards.html">Name Cards</a><a href="semicircle.html">Circle Text</a></nav>
    <header>
      <h1>Bingo Card Maker</h1>
      <p class="sub">Paste your clues, pick a free space, and download randomized cards as a PDF.</p>
    </header>

    <form id="form" autocomplete="off">
      <section class="panel">
        <label for="title">Card title</label>
        <input id="title" type="text" value="Wedding Bingo" maxlength="80">

        <label for="rules">Game explanation <span class="hint">(optional, printed above the grid)</span></label>
        <textarea id="rules" rows="3" placeholder="Mark a square each time you see it happen. Five in a row wins."></textarea>

        <label for="clues">Clues <span class="hint">(one per line)</span></label>
        <textarea id="clues" rows="14" placeholder="Someone cries during the vows&#10;The DJ plays the Macarena&#10;..."></textarea>
        <p id="clueCount" class="hint"></p>

        <label for="free">Free space text</label>
        <input id="free" type="text" value="FREE" maxlength="120">
        <label class="check"><input id="useFree" type="checkbox" checked> Include a free space in the center</label>
      </section>

      <section class="panel grid2">
        <div>
          <label for="titleFont">Title font</label>
          <select id="titleFont" class="font-select"></select>
          <p class="font-sample" data-for="titleFont">Wedding Bingo</p>
        </div>
        <div>
          <label for="clueFont">Clue font</label>
          <select id="clueFont" class="font-select"></select>
          <p class="font-sample" data-for="clueFont">The first dance</p>
        </div>
      </section>

      <section class="panel grid2">
        <div>
          <label for="size">Grid size</label>
          <select id="size">
            <option value="3">3 × 3</option>
            <option value="4">4 × 4</option>
            <option value="5" selected>5 × 5</option>
            <option value="6">6 × 6</option>
            <option value="7">7 × 7</option>
          </select>
        </div>
        <div>
          <label for="count">Number of cards</label>
          <input id="count" type="number" min="1" max="1000" value="20">
        </div>
        <div>
          <label for="paper">Paper</label>
          <select id="paper">
            <option value="letter" selected>Letter</option>
            <option value="a4">A4</option>
          </select>
        </div>
        <div>
          <label for="border">Border</label>
          <select id="border">
            <option value="northwest" selected>Pacific Northwest artwork</option>
            <option value="none">None: text only, outlined cut lines</option>
          </select>
        </div>
      </section>

      <section class="panel">
        <label for="bgFile">Card back image <span class="hint">(optional)</span></label>
        <div class="file-row">
          <input id="bgFile" type="file" accept="image/*">
          <button type="button" id="bgClear" class="secondary" hidden>Remove image</button>
        </div>
        <p class="hint">The card backs combine into one large picture.</p>
        <div id="bgOptions" hidden>
          <div class="grid2 spaced">
            <div id="arrangeWrap">
              <label for="arrange">Picture grid <span class="hint">(columns × rows)</span></label>
              <input id="arrange" type="text" inputmode="text" placeholder="Auto, or e.g. 4x5" autocomplete="off">
            </div>
            <div>
              <label for="flip">Double-sided printing</label>
              <select id="flip">
                <option value="long" selected>Flip on long edge</option>
                <option value="short">Flip on short edge</option>
              </select>
            </div>
          </div>
          <div class="grid2 spaced">
            <div>
              <label for="bgStyle">Image style</label>
              <select id="bgStyle">
                <option value="photo" selected>Photo as is</option>
                <option value="floyd">Dithered: scattered dots</option>
                <option value="atkinson">Dithered: high contrast</option>
                <option value="ordered">Dithered: regular pattern</option>
              </select>
            </div>
            <div id="dotSizeWrap">
              <label for="dotSize">Dot size</label>
              <select id="dotSize">
                <option value="64">Fine (64 dots across a card)</option>
                <option value="48">Medium (48 across)</option>
                <option value="36" selected>Large (36 across)</option>
                <option value="24">Coarse (24 across)</option>
              </select>
            </div>
          </div>
          <p id="bgHint" class="hint"></p>
          <canvas id="bgPreview" hidden></canvas>
        </div>
      </section>

      <p id="error" class="error" role="alert"></p>

      <div class="actions">
        <button type="button" id="shuffleBtn" class="secondary">Reshuffle cards</button>
        <button type="submit" id="downloadBtn">Download PDF</button>
      </div>
    </form>

    <section class="panel">
      <h2>PDF preview <span id="status" class="hint"></span></h2>
      <iframe id="pdfFrame" title="Generated bingo cards PDF"></iframe>
      <p id="pdfEmpty" class="empty">Add enough clues to generate cards.</p>
    </section>
  </main>

  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="pdf-fonts.js?v=20261105s"></script>
  <script src="pdf-canvas.js?v=20261105s"></script>
  <script src="pnw-art.js?v=20261105s"></script>
  <script src="dither.js?v=20261105s"></script>
  <script src="app.js?v=20261105s"></script>
</body>
</html>
